
name: civichub-2

services:
  web:
    build: .
    container_name: civichub-php
    restart: unless-stopped
    environment:
      DB_HOST: ${DB_HOST:-db}
      DB_NAME: ${DB_NAME:-db_civichub}
      DB_USER: ${DB_USER:-root}
      DB_PASS: ${DB_PASS:?Set DB_PASS in .env}
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:latest
    container_name: civichub-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web

  db:
    image: mysql:8.0
    container_name: civichub-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS:?Set DB_PASS in .env}
      MYSQL_DATABASE: ${DB_NAME:-db_civichub}
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./civichub-schema.sql:/docker-entrypoint-initdb.d/civichub-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$${MYSQL_ROOT_PASSWORD}\""]
      interval: 5s
      timeout: 5s
      retries: 20

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: civichub-phpmyadmin
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306

volumes:
  db_data:
