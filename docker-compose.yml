
services:
  web:
    build: .
    container_name: civichub-web
    environment:
      DB_HOST: db
      DB_NAME: db_civichub
      DB_USER: root
      DB_PASS: rootcivichub
    ports:
      - "8080:80"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/var/www/html

  db:
    image: mysql:8.0
    container_name: civichub-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootcivichub
      MYSQL_DATABASE: db_civichub
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./civichub-schema.sql:/docker-entrypoint-initdb.d/civichub-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootcivichub"]
      interval: 5s
      timeout: 5s
      retries: 20

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: civichub-phpmyadmin
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306

volumes:
  db_data:
